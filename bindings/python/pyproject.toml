[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commiv"
version = "0.2.0"
description = "Near-optimal directed (asymmetric) TSP / CVRP / VRPTW routes — Python binding over libcommiv"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["vrp", "cvrp", "tsp", "atsp", "vrptw", "routing", "logistics", "optimization"]

[project.urls]
Homepage = "https://github.com/grechman/Commiv"

[tool.setuptools.packages.find]
include = ["commiv*"]
