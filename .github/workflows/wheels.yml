name: wheels

# Builds the pip wheels (linux x86_64 + macOS arm64/x86_64, all
# Zig-cross-compiled from one Linux runner — the library is libc-free on
# Linux and links libSystem on macOS, so no per-OS runners are needed) and
# the from-scratch docker image. Wheels upload to PyPI only on a version
# tag (v*), using the PYPI_API_TOKEN repository secret.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build wheels
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          bash tools/build_wheels.sh
      - name: Smoke-test the linux wheel in a clean venv
        run: |
          python3 -m venv /tmp/wt
          /tmp/wt/bin/pip install dist/commiv-*-manylinux2014_x86_64.whl
          cd /tmp && /tmp/wt/bin/python - << 'EOF'
          import commiv
          M = [[0,10,12,14,16],[10,0,6,8,10],[12,6,0,7,9],[14,8,7,0,6],[16,10,9,6,0]]
          s = commiv.solve_pdptw(M,[1,2],[3,4],[4,5],10,[0]*5,[10000]*5,[0,3,3,3,3],seed=5,iters=2000)
          assert s.total_cost > 0 and sorted(c for r in s.routes for c in r) == [1,2,3,4]
          print("wheel smoke ok", commiv.version())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/commiv-*.whl
      - name: Publish to PyPI (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 -m pip install twine
          python3 -m twine upload dist/commiv-*.whl

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build static server + image
        run: |
          zig build serve -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast
          docker build -t ghcr.io/${{ github.repository_owner }}/commiv-serve:latest .
      - name: Smoke
        run: |
          docker run -d --rm -p 8080:8080 --name commiv-smoke ghcr.io/${{ github.repository_owner }}/commiv-serve:latest
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "server never became healthy; container logs:"
            docker logs commiv-smoke || true
            docker stop commiv-smoke || true
            exit 1
          fi
          docker stop commiv-smoke
      - name: Push to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/commiv-serve:latest
